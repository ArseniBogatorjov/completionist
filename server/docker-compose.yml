version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: completionist_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: completionist_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data

  redis_dev:
    image: redis:7-alpine
    container_name: completionist_redis
    ports:
      - "6379:6379"

volumes:
  pg_dev_data: